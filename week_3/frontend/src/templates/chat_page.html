<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resume Helper Chatbot</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0e0e10;
      --surface: #18181c;
      --surface2: #222228;
      --border: #2e2e38;
      --accent: #c8f135;
      --accent-dim: rgba(200, 241, 53, 0.12);
      --text: #e8e8ec;
      --text-muted: #7a7a8a;
      --user-bubble: #1f2d08;
      --user-border: #3a5210;
      --bot-bubble: #1a1a22;
      --bot-border: #2e2e3e;
      --radius: 14px;
      --font-ui: 'Syne', sans-serif;
      --font-mono: 'DM Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }
    .header-dot {
      width: 10px; height: 10px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    header h1 {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text);
    }
    .header-tag {
      margin-left: auto;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 3px 10px;
      border-radius: 99px;
    }

    /* ── Chat history ── */
    #chat-history {
      flex: 1;
      overflow-y: auto;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }
    #chat-history::-webkit-scrollbar { width: 4px; }
    #chat-history::-webkit-scrollbar-track { background: transparent; }
    #chat-history::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

    /* ── Message bubbles ── */
    .message {
      display: flex;
      gap: 10px;
      max-width: 78%;
      animation: fadeUp 0.2s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .message.user { align-self: flex-end; flex-direction: row-reverse; }
    .message.bot  { align-self: flex-start; }

    .avatar {
      width: 30px; height: 30px;
      border-radius: 8px;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
      font-family: var(--font-mono);
    }
    .message.user .avatar { background: var(--accent); color: #0e0e10; }
    .message.bot  .avatar { background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border); }

    .bubble {
      padding: 11px 16px;
      border-radius: var(--radius);
      font-size: 0.9rem;
      line-height: 1.6;
      word-break: break-word;
    }
    .message.user .bubble {
      background: var(--user-bubble);
      border: 1px solid var(--user-border);
      border-bottom-right-radius: 4px;
      color: #d4eea0;
    }
    .message.bot .bubble {
      background: var(--bot-bubble);
      border: 2px solid var(--bot-border);
      border-bottom-left-radius: 4px;
      color: var(--text);
    }

    .file-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent-dim);
      border: 1px solid var(--user-border);
      color: var(--accent);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      padding: 3px 10px;
      border-radius: 6px;
      margin-bottom: 8px;
    }

    /* Typing indicator */
    .typing-indicator {
      display: flex; gap: 5px;
      align-items: center;
      padding: 14px 16px;
    }
    .typing-indicator span {
      width: 6px; height: 6px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: bounce 1.2s ease-in-out infinite;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-6px); }
    }

    /* ── Input area ── */
    #input-area {
      border-top: 1px solid var(--border);
      background: var(--surface);
      padding: 16px 24px;
      flex-shrink: 0;
    }

    /* File upload strip */
    #file-strip {
      display: none;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      padding: 8px 12px;
      background: var(--accent-dim);
      border: 1px solid var(--user-border);
      border-radius: 10px;
      font-size: 0.8rem;
      color: var(--accent);
      font-family: var(--font-mono);
    }
    #file-strip.visible { display: flex; }
    #file-strip .remove-file {
      margin-left: auto;
      background: none; border: none;
      color: var(--text-muted); cursor: pointer;
      font-size: 1rem; line-height: 1;
      padding: 0 2px;
    }
    #file-strip .remove-file:hover { color: var(--text); }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    #user-input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 0.9rem;
      padding: 11px 16px;
      resize: none;
      min-height: 46px;
      max-height: 140px;
      transition: border-color 0.15s;
      line-height: 1.5;
    }
    #user-input:focus { outline: none; border-color: var(--accent); }
    #user-input::placeholder { color: var(--text-muted); }

    .icon-btn {
      width: 46px; height: 46px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text-muted);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      flex-shrink: 0;
    }
    .icon-btn:hover { background: var(--surface); color: var(--text); border-color: var(--text-muted); }

    #send-btn {
      background: var(--accent);
      border-color: var(--accent);
      color: #0e0e10;
    }
    #send-btn:hover { background: #d8ff45; border-color: #d8ff45; color: #0e0e10; }
    #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    #pdf-input { display: none; }

    .hint {
      margin-top: 8px;
      font-size: 0.72rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
      text-align: center;
    }

    /* Empty state */
    #empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--text-muted);
      text-align: center;
      padding: 40px;
    }
    #empty-state .big-icon { font-size: 2.5rem; opacity: 0.3; }
    #empty-state p { font-size: 0.85rem; max-width: 300px; line-height: 1.6; }

    /* Error toast */
    #error-toast {
      position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
      background: #3d1010; border: 1px solid #7a2020; color: #f08080;
      padding: 10px 18px; border-radius: 10px;
      font-size: 0.82rem; font-family: var(--font-mono);
      display: none; z-index: 999;
      animation: fadeUp 0.2s ease;
    }
    #error-toast.visible { display: block; }
  </style>
</head>
<body>

  <header>
    <div class="header-dot"></div>
    <h1>Resume Helper</h1>
    <span class="header-tag">AI Assistant</span>
  </header>

  <div id="chat-history">
    <div id="empty-state">
      <div class="big-icon">📄</div>
      <p>Upload your resume or ask me anything about job applications, CVs, and interviews.</p>
    </div>
  </div>

  <div id="error-toast"></div>

  <div id="input-area">
    <div id="file-strip">
      <span>📎</span>
      <span id="file-name-label"></span>
      <button class="remove-file" onclick="clearFile()" title="Remove file">✕</button>
    </div>

    <div class="input-row">
      <label for="pdf-input" class="icon-btn" title="Upload PDF">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="12" y1="18" x2="12" y2="12"/>
          <line x1="9" y1="15" x2="15" y2="15"/>
        </svg>
      </label>
      <input type="file" id="pdf-input" accept=".pdf" onchange="handleFileSelect(event)">

      <textarea
        id="user-input"
        placeholder="Ask about your resume, cover letter, interview prep…"
        rows="1"
        onkeydown="handleKey(event)"
        oninput="autoResize(this)"
      ></textarea>

      <button class="icon-btn" id="send-btn" onclick="sendMessage()" title="Send">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
    <p class="hint">Enter to send · Shift+Enter for new line · PDF upload supported</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.min.mjs" type="module"></script>

  <script type="module">
    // ── pdf.js setup ──────────────────────────────────────────────
    import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.min.mjs';
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.worker.min.mjs';
    window._pdfjsLib = pdfjsLib;

    // ── State ─────────────────────────────────────────────────────
    let pendingPdfText = null;
    let pendingFileName = null;
    let isLoading = false;

    const BACKEND_URL = "{{ backend_url }}";

    // ── DOM refs ──────────────────────────────────────────────────
    const chatHistory  = document.getElementById('chat-history');
    const emptyState   = document.getElementById('empty-state');
    const userInput    = document.getElementById('user-input');
    const sendBtn      = document.getElementById('send-btn');
    const fileStrip    = document.getElementById('file-strip');
    const fileLabel    = document.getElementById('file-name-label');
    const errorToast   = document.getElementById('error-toast');

    // ── Expose globals needed by inline handlers ──────────────────
    window.handleKey       = handleKey;
    window.autoResize      = autoResize;
    window.sendMessage     = sendMessage;
    window.handleFileSelect = handleFileSelect;
    window.clearFile       = clearFile;

    // ── Helpers ───────────────────────────────────────────────────
    function removeEmptyState() {
      if (emptyState) emptyState.remove();
    }

    function appendMessage(role, text, fileName = null) {
      removeEmptyState();
      const wrap = document.createElement('div');
      wrap.className = `message ${role}`;

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = role === 'user' ? 'You' : 'AI';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';

      if (fileName) {
        const badge = document.createElement('div');
        badge.className = 'file-badge';
        badge.innerHTML = `<span>📎</span><span>${fileName}</span>`;
        bubble.appendChild(badge);
      }

      const textNode = document.createElement('div');
      textNode.textContent = text;
      bubble.appendChild(textNode);

      wrap.appendChild(avatar);
      wrap.appendChild(bubble);
      chatHistory.appendChild(wrap);
      chatHistory.scrollTop = chatHistory.scrollHeight;
      return wrap;
    }

    function appendTyping() {
      removeEmptyState();
      const wrap = document.createElement('div');
      wrap.className = 'message bot';
      wrap.id = 'typing-msg';

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = 'AI';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerHTML = `<div class="typing-indicator"><span></span><span></span><span></span></div>`;

      wrap.appendChild(avatar);
      wrap.appendChild(bubble);
      chatHistory.appendChild(wrap);
      chatHistory.scrollTop = chatHistory.scrollHeight;
    }

    function removeTyping() {
      document.getElementById('typing-msg')?.remove();
    }

    function showError(msg) {
      errorToast.textContent = msg;
      errorToast.classList.add('visible');
      setTimeout(() => errorToast.classList.remove('visible'), 4000);
    }

    function setLoading(val) {
      isLoading = val;
      sendBtn.disabled = val;
      userInput.disabled = val;
    }

    // ── PDF extraction ────────────────────────────────────────────
    async function extractPdfText(file) {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await window._pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      let fullText = '';
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        fullText += content.items.map(item => item.str).join(' ') + '\n';
      }
      return fullText.trim();
    }

    // ── File handling ─────────────────────────────────────────────
    async function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;
      if (file.type !== 'application/pdf') {
        showError('Only PDF files are supported.');
        event.target.value = '';
        return;
      }
      try {
        pendingPdfText = await extractPdfText(file);
        pendingFileName = file.name;
        fileLabel.textContent = file.name;
        fileStrip.classList.add('visible');
      } catch (err) {
        showError('Failed to read PDF. Please try another file.');
        console.error(err);
      }
    }

    function clearFile() {
      pendingPdfText = null;
      pendingFileName = null;
      fileStrip.classList.remove('visible');
      document.getElementById('pdf-input').value = '';
    }

    // ── Send message ──────────────────────────────────────────────
    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text || isLoading) return;

      const fileName = pendingFileName;
      appendMessage('user', text, fileName);
      userInput.value = '';
      autoResize(userInput);

      const payload = { message: text };
      if (pendingPdfText) payload.pdf_text = pendingPdfText;
      clearFile();

      appendTyping();
      setLoading(true);

      try {
        const res = await fetch(`${BACKEND_URL}/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        removeTyping();

        if (!res.ok) {
          const err = await res.json().catch(() => ({ detail: 'Unknown error' }));
          showError(`Server error: ${err.detail || res.statusText}`);
          appendMessage('bot', '⚠️ Something went wrong. Please try again.');
        } else {
          const data = await res.json();
          appendMessage('bot', data.response ?? data.message ?? JSON.stringify(data));
        }
      } catch (err) {
        removeTyping();
        showError('Could not reach the backend server.');
        appendMessage('bot', '⚠️ Could not connect to the server.');
        console.error(err);
      } finally {
        setLoading(false);
      }
    }

    // ── Input helpers ─────────────────────────────────────────────
    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 140) + 'px';
    }
  </script>
</body>
</html>
